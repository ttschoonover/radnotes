[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radnotes"
dynamic = ["version"]
description = "Minimal markdown notes that sync between your devices and friends over Radicle"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Timothy Schoonover" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "markdown-it-py>=3.0", "mdit-py-plugins>=0.4"]
classifiers = [
  "License :: Other/Proprietary License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Editors",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ttschoonover/radnotes"
Issues = "https://github.com/ttschoonover/radnotes/issues"

[project.scripts]
radnotes = "radnotes.cli:main"

[tool.setuptools]
packages = ["radnotes"]

[tool.setuptools.dynamic]
version = { attr = "radnotes.__version__" }

[tool.setuptools.package-data]
radnotes = ["static/*"]
